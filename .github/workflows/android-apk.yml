name: Sync upstream and build Android APK

# Fortnightly: fast-forward this fork from slopus/happy, and if anything
# changed (or the app version moved), build an unsigned APK and publish it as
# a GitHub Release on this repo.
#
# Builds locally with `expo prebuild` + Gradle -- no EAS account required.

on:
    schedule:
        # 06:00 UTC on the 1st and 15th -> every ~2 weeks.
        - cron: '0 6 1,15 * *'
    workflow_dispatch:
        inputs:
            force_build:
                description: 'Build even when upstream has no new commits'
                type: boolean
                default: false
            app_env:
                description: 'APP_ENV variant to build'
                type: choice
                default: preview
                options: [preview, production, development]

concurrency:
    group: android-apk
    cancel-in-progress: false

permissions:
    contents: write

env:
    UPSTREAM: https://github.com/slopus/happy.git
    APP_ENV: ${{ inputs.app_env || 'preview' }}

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            changed: ${{ steps.check.outputs.changed }}
            sha: ${{ steps.check.outputs.sha }}
            short_sha: ${{ steps.check.outputs.short_sha }}
            version: ${{ steps.check.outputs.version }}
            tag: ${{ steps.check.outputs.tag }}
        steps:
            - name: Checkout fork
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Merge upstream
              run: |
                  git config user.name  'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
                  git fetch upstream --tags --prune
                  BEFORE=$(git rev-parse HEAD)
                  # Keep our workflow/README on top of upstream's history.
                  git merge --no-edit -X ours upstream/main || {
                      echo "::error::Merge conflict with upstream -- resolve locally"; exit 1; }
                  echo "BEFORE=$BEFORE" >> "$GITHUB_ENV"

            - name: Detect changes
              id: check
              run: |
                  AFTER=$(git rev-parse HEAD)
                  VERSION=$(node -e "console.log((require('fs').readFileSync('packages/happy-app/app.config.js','utf8').match(/^\s*version:\s*[\"']([^\"']+)[\"']/m)||[])[1]||'0.0.0')")
                  TAG="v${VERSION}-$(git rev-parse --short upstream/main)"

                  # Build when upstream moved, when we have no release for this
                  # tag yet, or when manually forced.
                  CHANGED=false
                  [ "$BEFORE" != "$AFTER" ] && CHANGED=true
                  if ! gh release view "$TAG" >/dev/null 2>&1; then CHANGED=true; fi
                  [ "${{ inputs.force_build }}" = "true" ] && CHANGED=true

                  {
                    echo "changed=$CHANGED"
                    echo "sha=$AFTER"
                    echo "short_sha=$(git rev-parse --short upstream/main)"
                    echo "version=$VERSION"
                    echo "tag=$TAG"
                  } >> "$GITHUB_OUTPUT"

                  echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
                  echo "- app version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "- upstream: \`$(git rev-parse --short upstream/main)\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "- build needed: \`$CHANGED\`" >> "$GITHUB_STEP_SUMMARY"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Push merged history
              if: steps.check.outputs.changed == 'true'
              run: git push origin HEAD:${{ github.event.repository.default_branch }}

    build:
        needs: sync
        if: needs.sync.outputs.changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
            SKIP_HAPPY_WIRE_BUILD: '1'
            # Single ABI. Building all four (armeabi-v7a, arm64-v8a, x86,
            # x86_64) compiles a full RN/Hermes native toolchain per arch and
            # is what exhausted the runner disk. arm64-v8a covers essentially
            # every phone made since ~2017; x86/x86_64 are emulator-only.
            ANDROID_ABI: arm64-v8a
        steps:
            # NOTE: easimon/maximize-build-space was tried here and made things
            # WORSE on this runner image. It assumes the old 84G VM with a
            # separate 14G /mnt temp disk; this runner is a 145G single volume
            # with 87G already free and no /mnt. The action packed root to
            # 100% (256M left) to build a 92G workspace LV, and Setup Android
            # SDK then died unzipping the emulator into $ANDROID_HOME on root.
            # There is ample space here -- the real fix is not downloading the
            # ~9G emulator we never use.
            - name: Show disk before build
              run: df -h / /mnt 2>/dev/null || df -h /

            - name: Checkout merged commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.sync.outputs.sha }}
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            # `packages: ''` skips the default 'tools platform-tools' install.
            # The legacy 'tools' package pulls the ~9G Android Emulator, which a
            # headless APK build never runs. Gradle resolves the platform and
            # build-tools it needs on its own.
            - name: Setup Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: ''

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Expo prebuild (generate android/)
              working-directory: packages/happy-app
              run: pnpm exec expo prebuild --platform android --no-install

            - name: Gradle assembleRelease
              working-directory: packages/happy-app/android
              run: |
                  df -h / | tail -1
                  ./gradlew assembleRelease --no-daemon --stacktrace \
                      -PreactNativeArchitectures="$ANDROID_ABI"
                  df -h / | tail -1

            - name: Collect APKs
              id: collect
              run: |
                  mkdir -p dist
                  find packages/happy-app/android -name '*.apk' -path '*release*' -exec cp {} dist/ \;
                  # Name the artifact after the version so downloads are identifiable.
                  for f in dist/*.apk; do
                      [ -e "$f" ] || continue
                      mv "$f" "dist/happy-${{ needs.sync.outputs.version }}-${APP_ENV}-$(basename "$f")"
                  done
                  ls -la dist
                  echo "count=$(find dist -name '*.apk' | wc -l)" >> "$GITHUB_OUTPUT"

            - name: Fail if no APK produced
              if: steps.collect.outputs.count == '0'
              run: echo "::error::Gradle succeeded but produced no APK" && exit 1

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: happy-android-${{ needs.sync.outputs.version }}
                  path: dist/*.apk
                  retention-days: 90
                  if-no-files-found: error

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${{ needs.sync.outputs.tag }}" dist/*.apk \
                    --title "Happy ${{ needs.sync.outputs.version }} (${{ needs.sync.outputs.short_sha }})" \
                    --notes "Unsigned \`${APP_ENV}\` Android APK.

                  | | |
                  |---|---|
                  | app version | \`${{ needs.sync.outputs.version }}\` |
                  | upstream commit | [\`${{ needs.sync.outputs.short_sha }}\`](https://github.com/slopus/happy/commit/${{ needs.sync.outputs.short_sha }}) |
                  | built from | \`${{ needs.sync.outputs.sha }}\` |

                  **Install:** download the \`.apk\` below and sideload it.

                  Debug-signed by Gradle, so uninstall any Play Store build first (signature mismatch).
                  Push notifications use the upstream Firebase project, and deep links still point at \`app.happy.engineering\`." \
                    || gh release upload "${{ needs.sync.outputs.tag }}" dist/*.apk --clobber

            - name: Summary
              run: |
                  echo "### APK published" >> "$GITHUB_STEP_SUMMARY"
                  echo "Release: \`${{ needs.sync.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
                  ls dist >> "$GITHUB_STEP_SUMMARY"
